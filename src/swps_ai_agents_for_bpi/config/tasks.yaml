compliance_analysis_task:
  description: >
    Analyze all available compliance-related information from structured data, KPIs, and extracted textual inputs.
    Evaluate the given process against potentially given internal compliance rules,
    policies, governance guidelines, or company-specific control requirements that are explicitly
    provided or can be inferred from the company context.
    If explicit external legal, regulatory, or industry norms are provided, research these norms
    online and assess the process against them. In addition, always research other potentially
    relevant external laws, regulations, or standards applicable to the given process, company,
    and industry context in the year {current_year}, even if some norms are already provided.
    Based on internal and external requirements, identify rule-violations, non-compliant activities and structural
    compliance gaps in the process. Propose concrete, directly implementable compliance
    improvements. The knowledge repository of process redesign patterns may be used as an
    optional support if helpful.
    Base all findings and improvements strictly on explicitly available information, researched norms, internal
    compliance requirements, and applicable redesign patterns.
    Available process kpi's: {process_kpis_compliance}
    CRITICAL OUTPUT FORMAT REQUIREMENT: Your response MUST begin with exactly these 4 metadata lines. This is mandatory and non-negotiable.
  expected_output: >
    A structured optimization proposal in syntactically correct Markdown format (language: english), summarizing the compliance analysis.
    Clearly describe the identified or researched legal and regulatory norms, assess how the existing process complies with or violates these norms
    and any given internal compliance guidelines. Based on that, describe concrete and directly applicable compliance improvement recommendations that ensure 
    compliance with the researched legal and regulatory norms as well as any given internal compliance guidelines. Do not include introductions, conclusions, summaries, narrative commentary 
    or things like the advantages/opportunities of the redesigned process, expected results of the new process designs or similar.
    
    MANDATORY: Your response MUST start with this EXACT line at the very beginning (replace brackets with actual values):
    
    **Compliance Issues Found:** [number]
    
    ---
    
    Example of correct start:
    **Compliance Issues Found:** 4
    
    ---
    
    After the metadata, the main emphasis starts:
    
    ## 1. Relevant Legal & Regulatory Norms
    List the researched and applicable legal and regulatory norms with its key requirements.
    
    ## 2. Compliance Assessment (External norms)
    Describe the identified legal/regulatory norm violations in the given business process.

    ## 3. Compliance Assessment (Internal regulations)
    Describe the internal compliance violations in the given business process.
    
    ## 4. Compliance Improvement Recommendations
    Propose concrete, implementable changes to achieve full compliance.
    
    REMINDER: Do NOT skip the metadata header. The first line of your response must be the number of found compliance issues.
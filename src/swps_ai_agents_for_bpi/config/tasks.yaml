# Phase 1.1: Unstructured User Input -> Structured Requirements 
analyze_user_input_task:
  description: >
    Process any unstructured input provided by the user, which may include textual
    process descriptions, different perspectives on the process, compliance documents, regulatory texts, process KPIs, goals,
    constraints, risk information, roles, resources, or any other domain-relevant data.
    Extract and normalize all explicit information and transform it into a structured
    JSON format. Do not make assumptions or infer missing information. Only include
    fields that are directly provided. User Input: {textual_user_input}
  expected_output: >
    A structured JSON object containing all explicitly provided information.
    
# Phase 1.2: Provided company name -> Enrich the given input with publicly available company-information and macro-data
analyze_economic_context_task:
  description: >
    Analyze the organization named in the user input by gathering contextual company information 
    and assessing relevant macroeconomic and industry-wide factors in the years {last_year}, {current_year}, and estimates for {next_year}. 
    Summarize the company’s current situation, 
    strategic posture, and external economic conditions that may influence decision-making or process improvement considerations. 
    Use only information that is explicitly provided or can be reliably researched.
  expected_output: >
    A structured JSON report including:
    - company overview (based on the provided company name)
    - organizational characteristics (e.g., financial posture, strategic orientation, market position)
    - industry context
    - macroeconomic factors and global/regional economic conditions
    - how these contextual insights may affect process design or improvement considerations

# Phase 2: Structured Requirements -> Structured Analysis Plan and Delegation of Tasks
# Bis jetzt noch nicht ready
plan_analysis_task:
  description: >
    Using all information available, create a clear
    analysis plan for the specialized agents. Determine which aspects of the input
    each agent should review or analyze, and allocate the relevant information to them.
    Ensure that the plan is comprehensive, evidence-based, and based only on the
    explicitly provided information.
  expected_output: >
    A structured JSON object representing the analysis plan. This plan defines
    which specialized agents are responsible for which areas of analysis and
    specifies the data and information they will use.

# Phase 3: Structured Analysis Plan and Delegation of Tasks -> Domain-Specific Analysis
performance_analysis_task:
  description: >
    Analyze the performance of the given process using all explicitly provided information,
    including structured data, KPIs, and extracted textual inputs.
    Identify process-related performance issues and performance inefficiencies, and propose evidence-based process performance
    improvement options based strictly on the available data, which are aligned with the given 
    information about the company as well as the current macroeconomic factors. Avoid generic recommendations (e.g., “implement KPIs”, 
    “continuous monitoring”, “feedback loops”). Do not analyze or mention costs, just focus on the process performance.
    Available process kpi's: {process_kpis}
  expected_output: >
    A structured optimization proposal summarizing the performance analysis. Clearly describe the
    process performance improvement suggestions and the rationale behind them.

finance_analysis_task:
  description: >
    Analyze the financial efficiency of the process using all explicitly provided information,
    including structured data, KPIs, and extracted textual inputs.
    Identify process-related cost issues, financial inefficiencies, and propose evidence-based process cost
    improvement and saving options based strictly on the available data, which are aligned with the given 
    information about the company as well as the current macroeconomic factors. Avoid generic recommendations (e.g., “implement KPIs”, 
    “continuous monitoring”, “feedback loops”). Do not analyze or mention performance, just focus on the process costs.
    Available process kpi's: {process_kpis}
  expected_output: >
    A structured optimization proposal summarizing the financial analysis. Clearly describe the
    process cost improvement suggestions and the rationale behind them.

# Bis jetzt noch nicht ready
risk_analysis_task:
  description: >
    Analyze the risks of the process using all explicitly provided information,
    including structured data, KPIs, extracted textual inputs, information about the company as well as macroeconomic factors. Identify process risks, control
    weaknesses, and potential sources of volatility. Evaluate risks strictly based
    on the provided data and recommend mitigation options without assuming missing information. Available information: {process_kpis}
  expected_output: >
    A structured JSON object summarizing the risk analysis. Clearly indicate
    which input information was used, what risks and findings were identified,
    and what mitigation or improvement suggestions are proposed based on these findings.

compliance_analysis_task:
  description: >
    Analyze all available compliance-related information from structured data, KPIs, 
    or extracted textual inputs.
    If explicit legal or regulatory norms are provided, research these norms online and evaluate
    the given process against them. If no norms are given, use the provided company information and
    the given process to research potentially relevant laws, regulations, or industry
    standards the given process may need to comply with in the year {current_year}. 
    With these results, identify rule violations and non-compliant activities in the given process and
    propose detailed, data-supported compliance improvements without adding generic or speculative content.
    Available process kpi's: {process_kpis}
  expected_output: >
    A structured optimization proposal summarizing the compliance analysis. Clearly describe the
    identified or researched legal/regulatory norms, how the process adheres or violates these norms,
    and compliance improvement options (main emphasis) with clear rationales.

# Phase 4: Domain-specific Analysis -> Aggregate findings
# Bis jetzt noch nicht ready
aggregate_findings_task:
  description: >
    Combine and synthesize all outputs from the specialized analysis agents
    (performance, finance, risk, compliance) into a single, coherent understanding
    of the analysis findings and improvement suggestions. Identify cross-domain insights, synergies,
    conflicts, and dependencies between the domain-specific findings.
  expected_output: >
    A structured JSON object summarizing findings and improvement suggestions from the domain-specific analysis (performance, finance, risk, compliance)

# Phase 5: Aggregate findings -> Generate Improvement Recommendations
# Hier nochmal schauen, ob das ganze wirklich benötigt wird
# Bis jetzt noch nicht ready
generate_improvements_task:
  description: >
    Take all aggregated findings and previously suggested improvement proposals
    from specialized analysis agents (performance, finance, risk, compliance) as input.
    Combine and integrate the domain-specific results to generate at least three holistic, coherent
    descriptions of process improvement suggestions, based on the combineability of previously improvement suggestions
  expected_output: >
    A structured JSON object containing at least three holistic process improvement suggestions.

# Phase 6: Generate Improvement Recommendations -> Evaluate Improvement Recommendations
# Eventuelles Problem, dass die Antwort von dem Agent nicht berücksichtig wird oder dass zu viele Iterationsschleifen gedreht werden
# Bis jetzt noch nicht ready
evaluate_improvements_task:
  description: >
    Evaluate the proposed process improvements suggestions from the orchestrator. Assess alignment with goals,
    constraints, compliance, risk tolerance, and available performance or financial data.
    Provide an objective comparison with the as-is process and recommend a release or rejection of the improvement ideas.
  expected_output: >
    A structured JSON object summarizing the evaluation of the process improvement suggestions
    and a recommendation to adopt, modify, or reject each improvement suggestion.

# Phase 7: Final Result
# Hauptfrage: Was nehmen wir hier alles mit rein?
# Bis jetzt noch nicht ready
compile_final_report_task:
  description: >
    Create a final consolidated report that summarizes the most significant
    cross-domain findings and improvement suggestions. Use the aggregated
    analyses, the synthesized improvement description, and the evaluation
    results to produce a clear, coherent, and presentation-ready summary of
    the overall process assessment and recommended improvements.
  expected_output: >
    A structured Markdown report containing the key findings, the most
    relevant improvement suggestions, and their justification based on the
    provided analyses and evaluation results. The report should be concise,
    clearly structured, and formatted as Markdown without code fences.

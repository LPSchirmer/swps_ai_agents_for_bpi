# Phase 1.1: Unstructured User Input -> Structured Requirements 
analyze_user_input_task:
  description: >
    Process any input provided by the user, which may include textual
    process descriptions, company information, compliance documents, regulatory texts, process KPIs,
    process optimization goals, constraints, risk information, resources, or any other domain-relevant data.
    Extract and normalize all explicit relevant information and transform it into a structured
    JSON format. Do not make assumptions or infer missing information.
    Do not include filler words or paraphrases provided by the user. Only include
    fields that are directly provided. Textual User input: {textual_user_input}, Process data: {process_data_basic}.
    If Process data is given, process_information should include all that data.
  expected_output: >
    A structured JSON object containing all explicitly provided information.
    
# Phase 1.2: Provided company name -> Enrich the given input with publicly available maxroeconomic data, industry context, and company information
analyze_economic_context_task:
  description: >
    Analyze the organization named in the user input by gathering contextual company information
    and assessing relevant macroeconomic and industry-wide factors in the years {last_year}, {current_year}, and estimates for {next_year}.
    Summarize the company’s current financial posture, strategic orientation, market position and regional macroeconomic conditions.
    Use only information that is explicitly provided or can be reliably researched.
    Based on these findings, explicitly derive the key implications that
    are relevant for process redesign and improvement suggestions for the given company, industry sector and macroeconomic context.
  expected_output: >
    A structured JSON object containing all researched information.

# Phase 2: Enriched User Input (Outer Layers) -> Enrich User Input (Process Level, Inner Layer) -> Domain Specific Analysis
performance_analysis_task:
  description: >
    Redesign the given process with the explicit goal of improving performance, neglecting aspects like compliance issues, process costs or similar.
    Use the process redesign patterns available in the Knowledge Repository as the primary
    structuring foundation for the redesign.
    Select, adapt, and combine suitable patterns to best address the identified performance issues.
    In addition, actively use targeted web searches to identify industry-specific best practices, or reference process
    structures that are applicable to the given process, company context, and industry.
    Web research is an explicit and expected step whenever it helps to identify stronger
    or more suitable redesign options than those already provided.
    Base all redesign decisions strictly on explicitly available information, including
    structured data, KPIs, extracted textual inputs, supplied redesign options, knowledge
    repository patterns, and researched external best-practices.
    All redesign decisions must be consistent with the given
    company characteristics and the current macroeconomic context.
    Do not provide generic or non-actionable recommendations (e.g., “implement KPIs”, “continuous monitoring”, etc.).
    Do not include vague statements such as “redesign the process”, “consider parallelization”, or similar, 
    instead provide concrete process designs that implement those suggestions.
    Never provide unclear suggestions like "eliminate all rework" or similar.
    Rather investigate the root-cause of the identified performance issues and redesign the process to mitigate those. 
    Do not analyze or mention costs or compliance topics, focus exclusively on process performance.
    Your task is to deliver concrete, directly implementable process designs that measurably increase performance.
    Available process kpi's: {process_kpis_performance}
    
    CRITICAL OUTPUT FORMAT REQUIREMENT: Your response MUST begin with the metadata line. This is mandatory.
  expected_output: >
    A structured optimization proposal in Markdown format.
    
    MANDATORY: Your response MUST start with this EXACT line at the very beginning:
    
    **Performance Issues Found:** [number]
    
    ---
    
    Example of correct start:
    **Performance Issues Found:** 3
    
    ---
    
    After the metadata, continue with:
    
    ## 1. Identified Performance Issues
    List the key performance bottlenecks and inefficiencies found in the current process.
    
    ## 2. Root Cause Analysis  
    Explain the underlying causes of each identified issue.
    
    ## 3. Redesigned Process Flow
    Describe the optimized process flow with concrete, implementable changes.
    
    ## 4. Expected Performance Improvements
    Quantify the expected improvements where possible (e.g., time savings, throughput increase).
    
    REMINDER: Do NOT skip the metadata header. The first line must be **Performance Issues Found:**

finance_analysis_task:
  description: >
    Redesign the given process with the explicit goal of reducing costs, neglecting aspects like compliance issues, process performance or similar.
    Use the process redesign patterns available in the Knowledge Repository as the primary
    structuring foundation for the redesign.
    Select, adapt, and combine suitable patterns to best address the identified cost issues.
    In addition, actively use targeted web searches to identify industry-specific best practices, or reference process
    structures that are applicable to the given process, company context, and industry.
    Web research is an explicit and expected step whenever it helps to identify stronger
    or more suitable redesign options than those already provided.
    Base all redesign decisions strictly on explicitly available information, including
    structured data, KPIs, extracted textual inputs, supplied redesign options, knowledge
    repository patterns, and researched external best-practices.
    All redesign decisions must be consistent with the given
    company characteristics and the current macroeconomic context.
    If needed, perform targeted web searches to identify applicable redesign patterns or
    best-practice process structures relevant to the given process, company and industry context.
    Do not provide generic or non-actionable recommendations (e.g., “implement KPIs”, “continuous monitoring”, etc.).
    Do not include vague statements such as “redesign the process”, “consider parallelization”, or similar, 
    instead provide concrete process designs that implement those suggestions.
    Never provide unclear suggestions like "eliminate all rework" or similar.
    Rather investigate the root-cause of the identified cost issues and redesign the process to mitigate those.
    Do not analyze or mention performance or compliance topics, focus exclusively on process costs.
    Your task is to deliver concrete, directly implementable process designs that measurably reduce costs.
    Available process kpi's: {process_kpis_finance}
    
    CRITICAL OUTPUT FORMAT REQUIREMENT: Your response MUST begin with the metadata line. This is mandatory.
  expected_output: >
    A structured optimization proposal in Markdown format.
    
    MANDATORY: Your response MUST start with this EXACT line at the very beginning:
    
    **Cost Drivers Found:** [number]
    
    ---
    
    Example of correct start:
    **Cost Drivers Found:** 4
    
    ---
    
    After the metadata, continue with:
    
    ## 1. Identified Cost Drivers
    List the key cost drivers and inefficiencies found in the current process.
    
    ## 2. Root Cause Analysis  
    Explain the underlying causes of each identified cost issue.
    
    ## 3. Redesigned Process Flow
    Describe the optimized process flow with concrete, cost-reducing changes.
    
    ## 4. Expected Cost Savings
    Quantify the expected savings where possible (e.g., cost reduction percentages, resource savings).
    
    REMINDER: Do NOT skip the metadata header. The first line must be **Cost Drivers Found:**

compliance_analysis_task:
  description: >
    Analyze all available compliance-related information from structured data, KPIs, or extracted textual inputs.
    If explicit legal or regulatory norms are provided, research these norms online and evaluate
    the given process against them. If no norms are given, use the provided company information and
    the given process to research potentially relevant laws, regulations, or industry
    standards the given process may need to comply with in the year {current_year}.
    With these results, identify rule violations and non-compliant activities in the given process and
    propose detailed, data-supported compliance improvements without adding generic or speculative content.
    Available process kpi's: {process_kpis_compliance}
    
    CRITICAL OUTPUT FORMAT REQUIREMENT: Your response MUST begin with exactly these 4 metadata lines. This is mandatory and non-negotiable.
  expected_output: >
    A structured optimization proposal in Markdown format.
    
    MANDATORY: Your response MUST start with these EXACT 4 lines at the very beginning (replace brackets with actual values):
    
    **Company:** [company name]
    **Process:** [process name]  
    **Year:** [year]
    **Compliance Issues Found:** [number]
    
    ---
    
    Example of correct start:
    **Company:** Siemens AG
    **Process:** Order-to-Cash
    **Year:** 2026
    **Compliance Issues Found:** 4
    
    ---
    
    After the metadata, continue with:
    
    ## 1. Relevant Legal & Regulatory Norms
    List the applicable laws, regulations, and industry standards for the process.
    
    ## 2. Compliance Assessment
    Evaluate how the current process adheres to or violates these norms.
    
    ## 3. Identified Violations & Gaps
    Detail specific non-compliant activities and compliance gaps.
    
    ## 4. Compliance Improvement Recommendations
    Propose concrete, implementable changes to achieve full compliance.
    
    REMINDER: Do NOT skip the metadata header. The first 4 lines of your response must be the Company, Process, Year, and Compliance Issues Found fields.
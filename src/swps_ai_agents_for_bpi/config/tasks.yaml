# Phase 1.1: Unstructured User Input -> Structured Requirements 
analyze_user_input_task:
  description: >
    Process any input provided by the user, which may include textual
    process descriptions, company information, compliance documents, regulatory texts, process KPIs,
    process optimization goals, constraints, risk information, resources, or any other domain-relevant data.
    Extract and normalize all explicit relevant information and transform it into a structured
    JSON format. Do not make assumptions or infer missing information.
    Do not include filler words or paraphrases provided by the user. Only include
    fields that are directly provided. Textual User input: {textual_user_input}, Process data: {process_data_basic}.
    If Process data is given, process_information should include all that data.
  expected_output: >
    A structured JSON object (language: english) containing all explicitly provided information.
    
# Phase 1.2: Provided company name -> Enrich the given input with publicly available maxroeconomic data, industry context, and company information
analyze_economic_context_task:
  description: >
    Analyze the organization named in the user input by gathering contextual company information
    and assessing relevant macroeconomic and industry-wide factors in the years {last_year}, {current_year}, and estimates for {next_year}.
    Summarize the company’s current financial posture, strategic orientation, market position and regional macroeconomic conditions.
    Use only information that is explicitly provided or can be reliably researched.
    Based on these findings, explicitly derive the key implications that
    are relevant for process redesign and improvement suggestions for the given company, industry sector and macroeconomic context.
  expected_output: >
    A structured JSON object (language: english) containing all researched information.

# Phase 2: Enriched User Input (Outer Layers) -> Enrich User Input (Process Level, Inner Layer) -> Domain Specific Analysis
performance_analysis_task:
  description: >
    Redesign the given process with the explicit goal of improving performance, neglecting aspects like compliance issues, process costs or similar.
    Use the process redesign patterns available in the Knowledge Repository as the primary
    structuring foundation for the redesign.
    Select, adapt, and combine suitable patterns to best address the identified performance issues.
    In addition, actively use targeted web searches to identify industry-specific best practices, or reference process
    structures that are applicable to the given process, company context, and industry.
    Web research is an explicit and expected step whenever it helps to identify stronger
    or more suitable redesign options than those already provided.
    Base all redesign decisions strictly on explicitly available information, including
    structured data, KPIs, extracted textual inputs, supplied redesign options, knowledge
    repository patterns, and researched external best-practices.
    All redesign decisions must be consistent with the given
    company characteristics and the current macroeconomic context.
    Do not provide generic or non-actionable recommendations (e.g., “implement KPIs”, “continuous monitoring”, etc.).
    Do not include vague statements such as “redesign the process”, “consider parallelization”, or similar, 
    instead provide concrete process designs that implement those suggestions.
    Never provide unclear suggestions like "eliminate all rework" or similar.
    Rather investigate the root-cause of the identified performance issues and redesign the process to mitigate those. 
    Do not analyze or mention costs or compliance topics, focus exclusively on process performance.
    Your task is to deliver concrete, directly implementable process designs that measurably increase performance.
    Available process kpi's: {process_kpis_performance}
    CRITICAL OUTPUT FORMAT REQUIREMENT: Your response MUST begin with the metadata line. This is mandatory.
  expected_output: >
    A structured optimization proposal in syntactically correct Markdown format (language: english), containing clear performance-improved process designs.
    Describe the flow of the redesigned process in approximately 100-200 words and its major changes compared to the previous process. Do not include introductions, conclusions, summaries, narrative commentary 
    or things like the advantages/opportunities of the redesigned process, expected results of the new process designs or similar.
    
    MANDATORY: Your response MUST start with this EXACT line at the very beginning (replace brackets with actual values):
    
    **Performance Issues Found:** [number]
    
    ---
    
    Example of correct start:
    **Performance Issues Found:** 3
    
    ---
    
    After the metadata, the main emphasis starts:
    
    ## 1. Redesigned Process Flow
    Describe the optimized process flow with concrete, implementable changes. Structure this text in detailed bullet points.

    ## 2. Major changes
    Briefly describe the most important changes in the new process compared to the previous process.
    
    ## 3. Used process redesign patterns
    List (as an enumeration) the names of the process redesign patterns used.
    
    REMINDER: Do NOT skip the metadata header. The first line must be **Performance Issues Found:**

